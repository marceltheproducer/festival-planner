<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- newsprint red tile -->
  <rect width="32" height="32" fill="#d3382a"/>
  <!-- ticket body (cream, ink border) -->
  <rect x="3.5" y="8.5" width="25" height="15" fill="#ece3cd" stroke="#1b1712" stroke-width="2"/>
  <!-- perforation tear line -->
  <line x1="21" y1="9.5" x2="21" y2="22.5" stroke="#1b1712" stroke-width="1.3" stroke-dasharray="1.7 1.5"/>
  <!-- tear notches (cut back to the tile) -->
  <circle cx="21" cy="8.5" r="2.4" fill="#d3382a"/>
  <circle cx="21" cy="23.5" r="2.4" fill="#d3382a"/>
  <!-- festival star on the main stub -->
  <path d="M12.4 11 L13.6 14.4 L17.2 14.5 L14.3 16.7 L15.4 20.1 L12.4 18 L9.4 20.1 L10.5 16.7 L7.6 14.5 L11.2 14.4 Z" fill="#d3382a"/>
</svg>
